sources:
  file_in:
    type: "file"
    include: ["/tmp/data.ndjson"]
    read_from: "beginning"

transforms:
  parse:
    type: "remap"
    inputs: ["file_in"]
    source: |
      parsed = parse_json!(.message)
      # ПОЛНАЯ ОЧИСТКА: удаляем всё, включая системные поля Vector
      . = {} 
      .timestamp = parsed.timestamp
      .event = parsed.event
      .user_id = to_int!(parsed.user_id)

sinks:
  ch_out:
    type: "clickhouse"
    inputs: ["parse"]
    endpoint: "http://clickhouse:8123"
    table: "events"
    auth:
      strategy: "basic"
      user: "default"
      password: "123"